[package]
name = "loudio"
version = "1.0.6"
description = "Loudio desktop transcription studio"
authors = ["Sudeepta Sarkar"]
license = "MIT"
repository = ""
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Free-space checks before multi-gigabyte downloads (statvfs).
libc = "0.2"
# macos-private-api backs `macOSPrivateApi` in tauri.conf.json, which is what
# makes the transparent window actually transparent on macOS. Compact mode
# rounds the window to 30px; without it those corners render opaque. Safe here
# because Loudio ships via Developer ID and a .dmg, never the Mac App Store —
# see docs/APPLE_SIGNING.md.
tauri = { version = "2", features = ["protocol-asset", "tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-clipboard-manager = "2"
# In-app updates. `process` supplies the relaunch that has to follow an install.
# Both are desktop-only; the target filter keeps them off any other platform.
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tokio = { version = "1", features = ["process", "rt-multi-thread", "macros", "io-util", "sync", "net", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = "2.0.2"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
