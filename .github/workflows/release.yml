name: Release

# Releases are tag-driven. Bumping the version in a commit does nothing on its
# own — pushing an annotated `v*` tag is what builds and publishes.
#
# Channel is derived from the tag:
#   v1.2.3          -> Stable   (latest release)
#   v1.2.3-rc.1     -> Release Candidate (prerelease)
#   v1.2.3-beta.1   -> Beta     (prerelease)
#   v1.2.3-alpha.1  -> Alpha    (prerelease)
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re-)release, e.g. v1.1.0"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate tag and version
    # Matches the packaging job in ci.yml: 22.04 ships the oldest AppStream
    # among supported targets, so the release gate must not be more lenient
    # than CI about metadata a 22.04 software centre has to parse.
    runs-on: ubuntu-22.04
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
      channel: ${{ steps.resolve.outputs.channel }}
      prerelease: ${{ steps.resolve.outputs.prerelease }}

    steps:
      - name: Resolve tag, version and channel
        id: resolve
        env:
          RAW_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          TAG="$RAW_TAG"

          # workflow_dispatch accepts free text, so the `v` prefix is not implied.
          case "$TAG" in
            v*) ;;
            *) echo "::error::Tag '$TAG' must start with 'v' (e.g. v1.1.0)"; exit 1 ;;
          esac

          VERSION="${TAG#v}"

          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc)\.[0-9]+)?$'; then
            echo "::error::Tag '$TAG' is not vX.Y.Z or vX.Y.Z-(alpha|beta|rc).N"
            exit 1
          fi

          case "$VERSION" in
            *-alpha.*) CHANNEL="Alpha";             PRERELEASE=true  ;;
            *-beta.*)  CHANNEL="Beta";              PRERELEASE=true  ;;
            *-rc.*)    CHANNEL="Release Candidate"; PRERELEASE=true  ;;
            *)         CHANNEL="Stable";            PRERELEASE=false ;;
          esac

          {
            echo "tag=$TAG"
            echo "version=$VERSION"
            echo "channel=$CHANNEL"
            echo "prerelease=$PRERELEASE"
          } >> "$GITHUB_OUTPUT"

          echo "Releasing $TAG as $CHANNEL (prerelease=$PRERELEASE)"

      - name: Checkout tagged commit
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.resolve.outputs.tag }}

      - name: Assert every manifest declares this version
        env:
          EXPECTED: ${{ steps.resolve.outputs.version }}
        run: |
          set -euo pipefail
          ACTUAL=$(node scripts/version.mjs --check)
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::Tag says $EXPECTED but the manifests declare $ACTUAL. Run 'yarn version:set $EXPECTED' and re-tag."
            exit 1
          fi
          echo "All manifests declare $ACTUAL"

      - name: Require a changelog entry for this version
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          if ! grep -qF "[$TAG]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no section heading containing [$TAG]"
            exit 1
          fi
          echo "Changelog entry found for $TAG"

      - name: Require release notes for this version
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          if ! grep -qF "$TAG" RELEASE_NOTES.md; then
            echo "::error::RELEASE_NOTES.md does not mention $TAG. It must describe this version only."
            exit 1
          fi
          echo "Release notes found for $TAG"

      - name: Install AppStream and desktop-entry validators
        run: |
          sudo apt-get update
          sudo apt-get install -y appstream desktop-file-utils

      - name: Validate store packaging metadata
        run: bash .github/scripts/validate-packaging.sh

      # Screenshots are fetched by stores from raw.githubusercontent.com, not
      # packaged. Missing ones show as blank slots on the store page, so this is
      # a hard gate at release time.
      - name: Require every screenshot URL to resolve
        run: bash .github/scripts/check-screenshots.sh

      - name: Require the MetaInfo to declare this version
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
        run: |
          set -euo pipefail
          DECLARED=$(node scripts/version.mjs --check)
          if [ "$DECLARED" != "$VERSION" ]; then
            echo "::error::version.mjs reports $DECLARED but the tag says $VERSION"
            exit 1
          fi
          echo "MetaInfo and all manifests declare $VERSION"

  build-linux:
    name: Build Linux (.deb)
    needs: validate
    # Pinned to 22.04 on purpose: binaries link against the runner's glibc, and
    # building on 24.04 would exclude every 22.04 user.
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.validate.outputs.tag }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          package-manager-cache: false

      - name: Enable Corepack and activate Yarn from packageManager
        run: |
          corepack enable
          YARN_VERSION=$(node -p "require('./package.json').packageManager.split('@')[1]")
          corepack prepare "yarn@${YARN_VERSION}" --activate

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          shared-key: ${{ runner.os }}-tauri

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Cache Yarn dependencies
        uses: actions/cache@v4
        with:
          path: |
            .yarn/cache
            .yarn/install-state.gz
            node_modules
          key: yarn-${{ runner.os }}-${{ hashFiles('yarn.lock', '.yarnrc.yml') }}
          restore-keys: |
            yarn-${{ runner.os }}-

      - name: Install JS dependencies
        run: yarn install --immutable

      - name: Typecheck
        run: yarn typecheck

      - name: Build .deb bundle
        # The signing key is what produces the .sig files the updater needs.
        # Without it the build still succeeds and simply ships no update path,
        # which the publish job then fails on rather than shipping silently.
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: yarn tauri build --bundles deb

      - name: Verify artifact versions
        env:
          EXPECTED_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          bash .github/scripts/verify-artifacts.sh "$EXPECTED_VERSION" \
            src-tauri/target/release/bundle/deb

      - name: Install package inspectors
        run: |
          sudo apt-get install -y appstream desktop-file-utils

      # Regression guard on the artifact itself: if deb.files or the desktop
      # template ever breaks, Tauri still emits a working package that has
      # quietly lost its store metadata.
      - name: Verify store metadata survived into the .deb
        run: |
          for deb in src-tauri/target/release/bundle/deb/*.deb; do
            bash .github/scripts/verify-deb-metadata.sh "$deb"
          done

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: loudio-linux
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/deb/*.deb.sig
          if-no-files-found: error

  build-macos:
    name: Build macOS .dmg (${{ matrix.arch }})
    needs: validate
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            arch: aarch64
          # Intel (x86_64) is deliberately not built. Apple is ending Intel Mac
          # support, and macOS warns on launch that the architecture is going
          # away, so shipping an x86_64 slice only produces that warning. Add a
          # `runner: macos-15-intel / arch: x86_64` entry here to bring it back.

    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.validate.outputs.tag }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          package-manager-cache: false

      - name: Enable Corepack and activate Yarn from packageManager
        run: |
          corepack enable
          YARN_VERSION=$(node -p "require('./package.json').packageManager.split('@')[1]")
          corepack prepare "yarn@${YARN_VERSION}" --activate

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          shared-key: ${{ runner.os }}-${{ matrix.arch }}-tauri

      - name: Cache Yarn dependencies
        uses: actions/cache@v4
        with:
          path: |
            .yarn/cache
            .yarn/install-state.gz
            node_modules
          key: yarn-${{ runner.os }}-${{ matrix.arch }}-${{ hashFiles('yarn.lock', '.yarnrc.yml') }}
          restore-keys: |
            yarn-${{ runner.os }}-${{ matrix.arch }}-

      - name: Install JS dependencies
        run: yarn install --immutable

      - name: Typecheck
        run: yarn typecheck

      - name: Select macOS signing mode
        id: signing
        env:
          APPLE_SIGNING_ENABLED: ${{ secrets.APPLE_SIGNING_ENABLED }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail

          if [ "${APPLE_SIGNING_ENABLED:-}" != "true" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Building unsigned .dmg — set APPLE_SIGNING_ENABLED=true to opt into Apple signing."
            exit 0
          fi

          if [ -z "${APPLE_CERTIFICATE:-}" ] || [ -z "${APPLE_CERTIFICATE_PASSWORD:-}" ] || [ -z "${APPLE_SIGNING_IDENTITY:-}" ]; then
            echo "::error::APPLE_SIGNING_ENABLED=true requires APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD and APPLE_SIGNING_IDENTITY."
            exit 1
          fi

          CERT_PATH="$RUNNER_TEMP/apple-signing-certificate.p12"
          if ! printf '%s' "$APPLE_CERTIFICATE" | base64 -D > "$CERT_PATH" 2>/dev/null; then
            echo "::error::APPLE_CERTIFICATE must be a base64-encoded .p12 file."
            exit 1
          fi

          if ! openssl pkcs12 -in "$CERT_PATH" -nokeys -passin "pass:$APPLE_CERTIFICATE_PASSWORD" -out /dev/null >/dev/null 2>&1; then
            echo "::error::APPLE_CERTIFICATE could not be opened with APPLE_CERTIFICATE_PASSWORD."
            exit 1
          fi

          echo "enabled=true" >> "$GITHUB_OUTPUT"

      # Ad-hoc signed ("-"), not left bare.
      #
      # Without an identity the bundler skips codesign entirely, but the linker
      # has already ad-hoc signed the arm64 Mach-O. That leaves a bundle whose
      # binary claims a signature while Contents/_CodeSignature does not exist,
      # and both `codesign --verify` and `spctl` reject it with:
      #
      #   code has no resources but signature indicates they must be present
      #
      # Gatekeeper surfaces that on a quarantined download as "Loudio is damaged
      # and can't be opened", which right-click -> Open cannot dismiss. Whether a
      # given download trips it depends only on whether it carries the quarantine
      # flag, which is why the same broken bundle can look fine when fetched with
      # curl and dead when fetched with a browser.
      #
      # Verified against the published v1.0.3 and v1.0.4 .dmg files: both are
      # "adhoc, linker-signed" with no _CodeSignature, and both fail to verify.
      # Signing the bundle ad-hoc makes it "valid on disk", leaving only the
      # ordinary "unidentified developer" prompt that right-click -> Open clears.
      # Still a stopgap: set the APPLE_* secrets for a notarized build.
      - name: Build ad-hoc signed .dmg
        if: steps.signing.outputs.enabled != 'true'
        env:
          APPLE_SIGNING_IDENTITY: "-"
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # tauri-bundler skips bundle_dmg.sh's Finder AppleScript whenever `CI`
          # is set, which silently drops the .dmg window layout — the app and
          # the Applications folder then land in Finder's default alphabetical
          # arrangement instead of side by side with a drag arrow between them.
          # v1.0.4 and v1.0.5 both shipped like that. This is the bundler's own
          # escape hatch; the verify step below fails the build if the layout
          # still does not come out.
          TAURI_BUNDLER_DMG_IGNORE_CI: "true"
        run: |
          unset APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD
          # `app` alongside `dmg`: the updater installs the .app.tar.gz emitted
          # for the app target, never the .dmg.
          yarn tauri build --bundles app,dmg

      - name: Verify the .app carries a signature
        if: steps.signing.outputs.enabled != 'true'
        run: |
          set -euo pipefail
          shopt -s nullglob
          found=0
          for app in src-tauri/target/release/bundle/macos/*.app; do
            found=1
            echo "Verifying $app"
            # Fails the build rather than shipping another "damaged" download.
            codesign --verify --deep --strict --verbose=2 "$app"
          done
          if [ "$found" -eq 0 ]; then
            echo "::error::No .app bundle found to verify."
            exit 1
          fi
          echo "Bundle signature verified; the .dmg will not read as damaged."

      - name: Build signed .dmg
        if: steps.signing.outputs.enabled == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # See the ad-hoc step above.
          TAURI_BUNDLER_DMG_IGNORE_CI: "true"
        run: yarn tauri build --bundles app,dmg

      - name: Notarize and staple
        if: steps.signing.outputs.enabled == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "${APPLE_ID:-}" ] || [ -z "${APPLE_PASSWORD:-}" ] || [ -z "${APPLE_TEAM_ID:-}" ]; then
            echo "Skipping notarization — APPLE_ID / APPLE_PASSWORD / APPLE_TEAM_ID not all set."
            exit 0
          fi

          set -euo pipefail
          shopt -s nullglob
          for dmg in src-tauri/target/release/bundle/dmg/*.dmg; do
            echo "Submitting $dmg for notarization"
            xcrun notarytool submit "$dmg" \
              --apple-id "$APPLE_ID" \
              --password "$APPLE_PASSWORD" \
              --team-id "$APPLE_TEAM_ID" \
              --wait
            xcrun stapler staple "$dmg"
          done

      - name: Verify artifact versions
        env:
          EXPECTED_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          bash .github/scripts/verify-artifacts.sh "$EXPECTED_VERSION" \
            src-tauri/target/release/bundle/dmg

      - name: Verify the .dmg carries its Finder layout
        run: |
          bash .github/scripts/verify-dmg-layout.sh \
            src-tauri/target/release/bundle/dmg

      # The bundler names the updater archive `Loudio.app.tar.gz` with no
      # architecture in it, so two matrix legs would produce the same filename,
      # collide in the flat release directory, and be published under whichever
      # platform key happened to win. Stamping the arch on here keeps the
      # manifest honest if the Intel leg is ever restored.
      - name: Name the updater artifacts by architecture
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          cd src-tauri/target/release/bundle/macos
          for f in Loudio.app.tar.gz Loudio.app.tar.gz.sig; do
            if [ ! -f "$f" ]; then
              echo "::error::Expected updater artifact '$f' was not produced."
              echo "::error::Check bundle.createUpdaterArtifacts and that"
              echo "::error::TAURI_SIGNING_PRIVATE_KEY was set for this build."
              exit 1
            fi
            mv "$f" "${f/Loudio.app/Loudio_${ARCH}.app}"
          done
          ls -la

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: loudio-macos-${{ matrix.arch }}
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.app.tar.gz
            src-tauri/target/release/bundle/macos/*.app.tar.gz.sig
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    # Every build must succeed before anything becomes visible. Publishing first
    # would leave a live release with no downloads whenever a build broke.
    needs: [validate, build-linux, build-macos]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.validate.outputs.tag }}

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: staging

      - name: Collect assets into a flat directory
        run: |
          set -euo pipefail
          mkdir -p dist
          # .tar.gz and .sig are the updater's artifacts; without them the
          # release publishes but no installed copy can ever update itself.
          find staging -type f \( -name '*.deb' -o -name '*.dmg' \
            -o -name '*.tar.gz' -o -name '*.sig' \) \
            -exec mv -n {} dist/ \;
          ls -la dist
          if [ -z "$(ls -A dist)" ]; then
            echo "::error::No release assets were collected."
            exit 1
          fi

      - name: Generate SHA256SUMS
        working-directory: dist
        run: |
          set -euo pipefail
          # `--` so an artifact whose name begins with a dash is treated as a
          # file rather than an option. Bare filenames are preserved, so the
          # published SHA256SUMS still verifies with a plain `sha256sum -c`.
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS

      - name: Compose the updater manifest
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          TAG: ${{ needs.validate.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          bash .github/scripts/compose-latest-json.sh \
            "$VERSION" dist \
            "https://github.com/$REPO/releases/download/$TAG" > dist/latest.json
          cat dist/latest.json

      - name: Compose release body
        env:
          TAG: ${{ needs.validate.outputs.tag }}
          CHANNEL: ${{ needs.validate.outputs.channel }}
          REPO: ${{ github.repository }}
        run: bash .github/scripts/compose-release-body.sh > body.md

      - name: Create or update the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.validate.outputs.tag }}
          name: Loudio ${{ needs.validate.outputs.tag }} — ${{ needs.validate.outputs.channel }}
          body_path: body.md
          files: dist/*
          prerelease: ${{ needs.validate.outputs.prerelease }}
          make_latest: ${{ needs.validate.outputs.prerelease == 'false' }}
          draft: false

  # ---------------------------------------------------------------------------
  # Snap
  #
  # Runs *after* publish, and deliberately not as a dependency of it: a Snap
  # Store failure must never stop the .deb and .dmg from reaching users.
  #
  # Publishes to beta, never straight to stable. Snaps auto-update, so a broken
  # stable revision reaches every user within a day, where a bad .deb only sits
  # on a releases page. Promotion is a manual step once the revision has been
  # checked:
  #
  #   snapcraft promote loudio --from-channel beta --to-channel stable
  # ---------------------------------------------------------------------------
  publish-snap:
    name: Build & publish the snap (beta)
    needs: [validate, publish]
    # Only stable tags reach the store at all; a prerelease tag builds nothing.
    if: needs.validate.outputs.prerelease == 'false'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.validate.outputs.tag }}

      # Publishing is opt-in, the same way Apple signing is: with no credential
      # set, the snap is still built and attached to the release, and only the
      # store upload is skipped. A missing secret must not turn a good release
      # red.
      - name: Check for store credentials
        id: creds
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        run: |
          set -euo pipefail
          if [ -n "${SNAPCRAFT_STORE_CREDENTIALS:-}" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "::notice::SNAPCRAFT_STORE_CREDENTIALS is not set — building the snap but not uploading it."
          fi

      - name: Build the snap
        id: build
        uses: snapcore/action-build@v1

      - name: Attach the snap to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.validate.outputs.tag }}
          files: ${{ steps.build.outputs.snap }}

      - name: Publish to the beta channel
        if: steps.creds.outputs.publish == 'true'
        uses: snapcore/action-publish@v1
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        with:
          snap: ${{ steps.build.outputs.snap }}
          release: beta
