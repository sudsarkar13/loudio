# Flatpak manifest for Loudio.
#
# Like the snap, this bundles the transcription engines rather than asking the
# user to install them: Flathub rejects apps that "rely on host components or
# complicated post installation setups for core functionality", which is exactly
# what the readiness wizard does on the .deb. FFmpeg comes free — the GNOME
# runtime already ships the binary — so only whisper.cpp is built here.
#
# Model downloads at run time are fine and are why --share=network is requested;
# the prohibition covers executables, not data. Buzz and Speech Note both ship
# on Flathub doing the same thing.
#
# The build runs with no network: crates come from cargo-sources.json and npm
# packages from node-sources.json, both generated by flatpak-builder-tools.
# Regenerate them whenever a dependency changes — see
# docs/STORE_DISTRIBUTION_PLAN.md.

app-id: io.github.sudsarkar13.loudio
runtime: org.gnome.Platform
runtime-version: '49'
sdk: org.gnome.Sdk
command: loudio

sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
  - org.freedesktop.Sdk.Extension.node24

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin:/usr/lib/sdk/node24/bin
  env:
    CARGO_HOME: /run/build/loudio/cargo
    # Keep Yarn's cache inside the build tree rather than in a HOME that may
    # not be writable.
    YARN_ENABLE_GLOBAL_CACHE: 'false'

finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri
  - --socket=pulseaudio          # microphone capture and playback
  - --share=network              # Whisper model downloads only
  # No blanket --filesystem: audio files are opened through the file chooser
  # portal, which grants access per file rather than to the whole home dir.

modules:
  - name: whisper-cpp
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DBUILD_SHARED_LIBS=OFF
      - -DWHISPER_BUILD_TESTS=OFF
      - -DWHISPER_BUILD_EXAMPLES=ON
      - -DWHISPER_BUILD_SERVER=OFF
    sources:
      - type: archive
        url: https://github.com/ggml-org/whisper.cpp/archive/refs/tags/v1.9.3.tar.gz
        sha256: 1650f884effba487025143bd8facd2f9fb40a83b3737a732803c67a8d659d9c0
    post-install:
      # Keep only what Loudio invokes; the rest of the examples are dead weight.
      - install -Dm755 bin/whisper-cli /app/bin/whisper-cli || true
      - find /app/bin -maxdepth 1 -type f ! -name whisper-cli ! -name loudio -delete || true

  - name: loudio
    buildsystem: simple
    # One script, not a list: flatpak-builder runs each command in a fresh
    # sandbox, where only the module's own source directory persists. A
    # directory created by one command is gone by the next.
    # One script, not a list: flatpak-builder runs each command in a fresh
    # sandbox, where only the module's own source directory persists.
    build-commands:
      - |
        set -eu

        # Yarn is vendored rather than fetched through corepack, which
        # downloads the version named in packageManager and so cannot work
        # without a network. This is the same 4.18.0 release that
        # packageManager pins, invoked directly.
        #
        # It is run as `node .../yarn.js`, not put on PATH: package.json
        # declares "type": "module", so a .js file resolved below it loads as
        # ESM and dies with 'Dynamic require of "util" is not supported'. The
        # vendored copy lives outside the checkout for the same reason.
        # A real executable on PATH, not a shell function: the Yarn plugin
        # spawns `yarn` for packages using the patch: protocol, and a function
        # is invisible to a child process.
        mkdir -p /run/yarn/bin
        cp flatpak-node/yarn.js /run/yarn/yarn.js
        printf '#!/bin/sh\nexec node /run/yarn/yarn.js "$@"\n' > /run/yarn/bin/yarn
        chmod +x /run/yarn/bin/yarn
        export PATH="/run/yarn/bin:${PATH}"

        # Yarn Berry resolves its cache to <globalFolder>/cache, which is where
        # flatpak-node-generator puts the downloaded tarballs. The plugin's
        # convertToZip turns those .tgz files into the .zip entries Yarn's
        # cache expects. Its positional argument is only used for git
        # dependencies, and this lockfile has none.
        export YARN_GLOBAL_FOLDER="${PWD}/flatpak-node/yarn-berry"
        yarn plugin import ./flatpak-node/flatpak-yarn.js
        yarn convertToZip yarn

        yarn install --immutable
        yarn build

        # Crates are vendored under cargo/vendor with a matching cargo/config,
        # so --offline must succeed rather than quietly reaching out.
        cargo build --release --offline --manifest-path src-tauri/Cargo.toml

        install -Dm755 src-tauri/target/release/loudio /app/bin/loudio
        install -Dm644 src-tauri/appstream/io.github.sudsarkar13.loudio.metainfo.xml \
          /app/share/metainfo/io.github.sudsarkar13.loudio.metainfo.xml
        # The metainfo is shared with the .deb, which names its desktop file
        # Loudio.desktop. appstreamcli compose resolves the icon through the
        # first launchable, finds no such file here, and rejects the component
        # with gui-app-without-icon. Drop the entry that does not apply.
        sed -i '/>Loudio.desktop</d' \
          /app/share/metainfo/io.github.sudsarkar13.loudio.metainfo.xml
        install -Dm644 flatpak/io.github.sudsarkar13.loudio.desktop \
          /app/share/applications/io.github.sudsarkar13.loudio.desktop
        install -Dm644 src-tauri/icons/64x64.png \
          /app/share/icons/hicolor/64x64/apps/io.github.sudsarkar13.loudio.png
        install -Dm644 src-tauri/icons/128x128.png \
          /app/share/icons/hicolor/128x128/apps/io.github.sudsarkar13.loudio.png
        install -Dm644 src-tauri/icons/icon.png \
          /app/share/icons/hicolor/512x512/apps/io.github.sudsarkar13.loudio.png
    sources:
      - type: git
        url: https://github.com/sudsarkar13/loudio.git
        tag: v1.0.4
        commit: c4b5459fb81e819d9a44bf444e6990bbd26e83e1
      - type: file
        url: https://repo.yarnpkg.com/4.18.0/packages/yarnpkg-cli/bin/yarn.js
        sha256: fb8b1d20be72a0b544a35bcec4c7ed0ff55a9b173c01f191b02ba164b2051db5
        dest: flatpak-node
      - cargo-sources.json
      - node-sources.json
