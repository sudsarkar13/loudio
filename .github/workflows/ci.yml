name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, Typecheck & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          package-manager-cache: false

      - name: Enable Corepack & activate Yarn
        run: |
          corepack enable
          YARN_VERSION=$(node -p "require('./package.json').packageManager.split('@')[1]")
          corepack prepare "yarn@${YARN_VERSION}" --activate
          echo "Using yarn@${YARN_VERSION}"

      - name: Verify Yarn version
        run: yarn --version

      - name: Cache Yarn dependencies
        uses: actions/cache@v4
        with:
          path: |
            .yarn/cache
            .yarn/install-state.gz
            node_modules
          key: yarn-${{ runner.os }}-${{ hashFiles('yarn.lock', '.yarnrc.yml') }}
          restore-keys: |
            yarn-${{ runner.os }}-

      - name: Install dependencies
        run: yarn install --immutable

      - name: Lint
        run: yarn lint

      - name: Typecheck
        run: yarn typecheck

      - name: Build
        run: yarn build

  packaging:
    name: Validate packaging metadata
    # Pinned to 22.04 on purpose: it ships AppStream 0.15, the oldest validator
    # among supported targets. Metadata that only parses on newer AppStream
    # would render incompletely in a 22.04 user's software centre, so validate
    # against the oldest rather than the newest.
    runs-on: ubuntu-22.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install AppStream and desktop-entry validators
        run: |
          sudo apt-get update
          sudo apt-get install -y appstream desktop-file-utils

      # Guards the metadata GNOME Software / KDE Discover read. Without it the
      # store page falls back to the bare dpkg fields and shows the app as
      # "loudio" with a "(none)" description and an Unknown License warning.
      - name: Validate AppStream and desktop entry
        run: bash .github/scripts/validate-packaging.sh

      # Advisory here: screenshots live on main and a feature branch may
      # legitimately not have them yet. The release workflow enforces this.
      - name: Check screenshot URLs (advisory)
        run: bash .github/scripts/check-screenshots.sh --warn-only
